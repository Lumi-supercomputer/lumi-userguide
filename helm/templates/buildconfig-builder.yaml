{{- $resourcename := include "lumi-docs.builderName" . -}}
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: {{ $resourcename }}
  labels:
{{ include "lumi-docs.labels" . | indent 4 }}
spec:
  triggers:
    - type: ConfigChange
    - type: ImageChange
      imageChange: {}
  output:
    to:
      kind: ImageStreamTag
      name: {{ $resourcename | printf "%s:latest" | squote }}
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: Containerfile.builder
      from:
        kind: ImageStreamTag
        namespace: openshift
        name: {{ .Values.baseImage | squote }}
  source:
    type: Git
    git:
{{ .Values.git | toYamlPretty | indent 6 }}