{{- $resourcename := include "lumi-docs.webhookSecretName" . -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $resourcename }}
  labels:
{{ include "lumi-docs.labels" . | indent 4 }}
type: Opaque
data:
  WebHookSecretKey: {{ lookup "v1"
                              "Secret"
                              .Release.Namespace
                              $resourcename
                       | dig "data" "WebHookSecretKey" (randAlphaNum 24 | b64enc) }}