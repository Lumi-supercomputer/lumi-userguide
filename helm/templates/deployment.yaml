{{- $resourcename := include "lumi-docs.name" . -}}
{{- $containername := $resourcename | printf "%s-server" | trunc 63 | trimSuffix "-" -}}
{{- $existingcontainers := lookup "apps/v1"
                                  "Deployment"
                                  .Release.Namespace
                                  $resourcename
                           | dig "spec" "template" "spec" "containers" list -}}
{{- $containerimage := printf "%s/%s/%s:latest" .Values.localRegistry
                                                .Release.Namespace
                                                $resourcename -}}
{{- if $existingcontainers -}}
{{- range $container := $existingcontainers -}}
{{- if $container.name | eq $containername -}}
{{- $containerimage = $container.image -}}
{{- end -}}
{{- end -}}
{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $resourcename }}
  labels:
{{ include "lumi-docs.labels" . | indent 4 }}
  annotations:
    image.openshift.io/triggers: |-
{{ dict "from" (dict "kind" "ImageStreamTag"
                           "name" ($resourcename | printf "%s:latest"))
       "fieldPath" ($containername | printf `spec.template.spec.containers[?(@.name=="%s")].image`)
   | list
   | toPrettyJson
   | indent 6 }}
spec:
  selector:
    matchLabels:
{{ include "lumi-docs.selectorLabels" . | indent 6 }}
  replicas: {{ .Values.replicaCount | default 1 }}
  template:
    metadata:
      labels:
{{ include "lumi-docs.labels" . | indent 8 }}
    spec:
      containers:
        - name: {{ $containername }}
          image: {{ $containerimage | squote }}
          ports:
            - containerPort: 8000
              protocol: TCP
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 25%
      maxSurge: 25%